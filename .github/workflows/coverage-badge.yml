name: Coverage Badge

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-badge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-risk-ttx-nextjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            ai-risk-ttx-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: ai-risk-ttx-nextjs/coverage

      - name: Generate coverage badge (lcov)
        uses: cicirello/coverage-badge@v2
        with:
          filename: ai-risk-ttx-nextjs/coverage/lcov.info

      - name: Commit badge to repo (push events only)
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update coverage badge"
          file_pattern: badges/coverage.svg

