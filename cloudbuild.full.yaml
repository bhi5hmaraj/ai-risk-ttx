# Cloud Build config for deploying Next.js + Colyseus to Cloud Run
# Builds both services in parallel and deploys them

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'

substitutions:
  _REGION: us-central1
  # BRANCH_NAME is auto-provided by Cloud Build triggers
  # For GitHub Actions, it's passed via --substitutions flag

steps:
  # ========== Prepare Deployment Variables ========== #
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'prepare-env'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail

        # Sanitize branch name for Cloud Run service names
        SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40)

        # Generate service names
        if [ "$BRANCH_NAME" == "main" ]; then
          WEB_SERVICE_NAME="simulacra-web-prod"
          COLYSEUS_SERVICE_NAME="simulacra-colyseus-prod"
          APP_URL="https://simulacra.cc"
          COLYSEUS_URL="https://game.simulacra.cc"
        else
          WEB_SERVICE_NAME="simulacra-web-${SANITIZED_BRANCH}"
          COLYSEUS_SERVICE_NAME="simulacra-colyseus-${SANITIZED_BRANCH}"
          # URLs will be auto-generated by Cloud Run
          APP_URL="https://${WEB_SERVICE_NAME}-${PROJECT_NUMBER}-${_REGION}.a.run.app"
          COLYSEUS_URL="https://${COLYSEUS_SERVICE_NAME}-${PROJECT_NUMBER}-${_REGION}.a.run.app"
        fi

        # Save to file for other steps to read
        echo "WEB_SERVICE_NAME=${WEB_SERVICE_NAME}" > /workspace/deploy-env.txt
        echo "COLYSEUS_SERVICE_NAME=${COLYSEUS_SERVICE_NAME}" >> /workspace/deploy-env.txt
        echo "APP_URL=${APP_URL}" >> /workspace/deploy-env.txt
        echo "COLYSEUS_URL=${COLYSEUS_URL}" >> /workspace/deploy-env.txt
        echo "BRANCH_NAME=${BRANCH_NAME}" >> /workspace/deploy-env.txt

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📋 Deployment Configuration"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Branch:           $BRANCH_NAME"
        echo "Web Service:      $WEB_SERVICE_NAME"
        echo "Colyseus Service: $COLYSEUS_SERVICE_NAME"
        echo "Frontend URL:     $APP_URL"
        echo "Game URL:         $COLYSEUS_URL"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ========== Build Next.js ========== #
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-nextjs'
    waitFor: ['-']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.nextjs'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/nextjs:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/nextjs:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-nextjs-build'
    waitFor: ['build-nextjs']
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/nextjs:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-nextjs-latest'
    waitFor: ['build-nextjs']
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/nextjs:latest'

  # ========== Build Colyseus ========== #
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-colyseus'
    waitFor: ['-']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.colyseus'
      - '--build-arg'
      - 'OPENAI_API_KEY=dummy'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/colyseus:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/colyseus:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-colyseus-build'
    waitFor: ['build-colyseus']
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/colyseus:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-colyseus-latest'
    waitFor: ['build-colyseus']
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/colyseus:latest'

  # ========== Deploy Next.js to Cloud Run ========== #
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-nextjs'
    entrypoint: 'bash'
    waitFor: ['prepare-env', 'push-nextjs-build', 'push-nextjs-latest']
    args:
      - '-c'
      - |
        set -euo pipefail

        # Load deployment variables
        source /workspace/deploy-env.txt

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📦 Deploying Next.js Frontend"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Branch:       $BRANCH_NAME"
        echo "Service:      $WEB_SERVICE_NAME"
        echo "Frontend URL: $APP_URL"
        echo "Game URL:     $COLYSEUS_URL"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        gcloud run deploy $WEB_SERVICE_NAME \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/nextjs:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --memory 1Gi \
          --cpu 1 \
          --timeout 60 \
          --min-instances 0 \
          --max-instances 3 \
          --set-env-vars NODE_ENV=production,NEXT_PUBLIC_APP_URL=$APP_URL,NEXT_PUBLIC_COLYSEUS_URL=$COLYSEUS_URL,NEXT_PUBLIC_COLYSEUS_HTTP_BASE=$COLYSEUS_URL \
          --set-secrets=INFISICAL_TOKEN=INFISICAL_TOKEN:latest

        # Print deployment URL
        DEPLOYED_URL=$(gcloud run services describe $WEB_SERVICE_NAME --region ${_REGION} --format='value(status.url)')
        echo ""
        echo "✅ Next.js deployed successfully!"
        echo "🔗 URL: $DEPLOYED_URL"

  # ========== Deploy Colyseus to Cloud Run ========== #
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-colyseus'
    entrypoint: 'bash'
    waitFor: ['prepare-env', 'push-colyseus-build', 'push-colyseus-latest']
    args:
      - '-c'
      - |
        set -euo pipefail

        # Load deployment variables
        source /workspace/deploy-env.txt

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🎮 Deploying Colyseus Game Server"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Branch:    $BRANCH_NAME"
        echo "Service:   $COLYSEUS_SERVICE_NAME"
        echo "Game URL:  $COLYSEUS_URL"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        gcloud run deploy $COLYSEUS_SERVICE_NAME \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/colyseus:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --memory 1Gi \
          --cpu 1 \
          --timeout 3600 \
          --session-affinity \
          --min-instances 1 \
          --max-instances 1 \
          --set-env-vars NODE_ENV=production \
          --set-secrets=INFISICAL_TOKEN=INFISICAL_TOKEN:latest

        # Print deployment URL
        DEPLOYED_URL=$(gcloud run services describe $COLYSEUS_SERVICE_NAME --region ${_REGION} --format='value(status.url)')
        echo ""
        echo "✅ Colyseus deployed successfully!"
        echo "🔗 URL: $DEPLOYED_URL"

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/nextjs:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/nextjs:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/colyseus:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/simulacra/colyseus:latest'
